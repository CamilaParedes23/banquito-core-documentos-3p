server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  mongodb:
    uri: ${MONGODB_URI}

management:
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${METRICS_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: ${HTTP_METRICS_HISTOGRAM_ENABLED:true}
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_METRICS_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    com.banquito.platform.document: ${LOG_LEVEL_APP}

banquito:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
  demo:
    enabled: ${DOCUMENT_DEMO_ENABLED}
  grpc:
    server:
      port: ${DOCUMENT_GRPC_PORT}
  storage:
    mode: ${DOCUMENT_STORAGE_MODE}
    base-path: ${DOCUMENT_STORAGE_BASE_PATH}
