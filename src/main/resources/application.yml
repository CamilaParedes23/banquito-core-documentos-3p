server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  mongodb:
    uri: ${MONGODB_URI}

springdoc:
  api-docs:
    path: ${OPENAPI_DOCS_PATH}
  swagger-ui:
    path: ${SWAGGER_UI_PATH}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    com.banquito.platform.document: ${LOG_LEVEL_APP}

banquito:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
  demo:
    enabled: ${DOCUMENT_DEMO_ENABLED}
  grpc:
    server:
      port: ${DOCUMENT_GRPC_PORT}
  storage:
    mode: ${DOCUMENT_STORAGE_MODE}
    base-path: ${DOCUMENT_STORAGE_BASE_PATH}
